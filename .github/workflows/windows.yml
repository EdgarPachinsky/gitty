name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # The .exe needs the DLLs and data/ folder next to it, so ship the whole Release folder.
      - uses: actions/upload-artifact@v4
        with:
          name: gitty-windows
          path: build/windows/x64/runner/Release/
