name: gitty
description: "Gitty — a calm, friendly Git companion for desktop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.0

  # Local storage (settings, repo cache, analytics). No code generation needed:
  # we store JSON strings in plain boxes.
  hive_ce: ^2.19.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure token storage for Git provider accounts
  flutter_secure_storage: ^10.3.0

  # Networking (GitHub API, local Ollama)
  http: ^1.2.2

  # Desktop helpers
  file_selector: ^1.0.3
  url_launcher: ^6.3.1

  # Brand icons for hosting services (GitHub, GitLab, Bitbucket, …)
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
